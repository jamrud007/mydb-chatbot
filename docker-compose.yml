version: '3.8'

services:
  # vLLM Server with GPU Support (NEW!)
  vllm:
    build:
      context: .
      dockerfile: docker/Dockerfile.vllm
    container_name: mydb-chatbot-vllm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "${VLLM_PORT:-8080}:8080"
    networks:
      - chatbot-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    shm_size: '8gb'
    profiles:
      - vllm # Only start when vllm profile is active

  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: mysql-chatbot-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme123}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_olist}
      MYSQL_USER: ${DB_USER:-chatbot_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sample_db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    networks:
      - chatbot-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: mysql-chatbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - chatbot-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysql-chatbot-backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=False
      - READ_ONLY_MODE=${READ_ONLY_MODE:-False}
      # Auto-detect vLLM or use fallback
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://vllm:8080/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key}
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    ports:
      - "${BACKEND_PORT:-5000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chatbot-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysql-chatbot-frontend
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      - backend
    networks:
      - chatbot-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  chatbot-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
