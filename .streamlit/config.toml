[server]
port = 8501
address = "0.0.0.0"
headless = true
runOnSave = false
enableCORS = true
enableXsrfProtection = true

[browser]
serverAddress = "your-domain.com"
gatherUsageStats = false
serverPort = 8501

[theme]
primaryColor = "#4CAF50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "warning"
messageFormat = "%(asctime)s %(message)s"
